name: TEHYS Windows Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/wpf-contract-entry-v0.5
      - feature/official-payment-document-templates
  pull_request:
    branches:
      - main
      - feature/wpf-contract-entry-v0.5

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore full solution
        run: dotnet restore ".\TEHYS.sln"

      - name: Verify Visual Studio 18 solution metadata
        shell: pwsh
        run: |
          $solution = Get-Content ".\TEHYS.sln" -Raw
          if (-not $solution.Contains("# Visual Studio Version 18")) { throw "Solution is not marked as Visual Studio 18." }
          if (-not $solution.Contains("VisualStudioVersion = 18.")) { throw "Expected a VisualStudioVersion value from the Visual Studio 18 family." }
          $projectOutput = dotnet sln ".\TEHYS.sln" list
          if ($LASTEXITCODE -ne 0) { throw "dotnet sln could not parse TEHYS.sln." }
          $projects = @($projectOutput | Where-Object { $_ -match "\.csproj\s*$" })
          if ($projects.Count -ne 6) { throw "Expected six projects in the solution; found $($projects.Count)." }

      - name: Build full solution
        run: dotnet build ".\TEHYS.sln" --configuration Release --no-restore

      - name: Build WPF
        run: dotnet build ".\src\OzelEgitimHakedis.Wpf\OzelEgitimHakedis.Wpf.csproj" --configuration Release --no-restore

      - name: Verify WPF output UI contract
        shell: pwsh
        run: |
          $xaml = Get-Content ".\src\OzelEgitimHakedis.Wpf\MainWindow.xaml" -Raw
          $code = (Get-ChildItem ".\src\OzelEgitimHakedis.Wpf" -Filter "MainWindow*.cs" | Sort-Object Name | ForEach-Object { Get-Content -LiteralPath $_.FullName -Raw }) -join "`n"
          [xml]$document = $xaml
          $namespaces = [System.Xml.XmlNamespaceManager]::new($document.NameTable)
          $namespaces.AddNamespace('x', 'http://schemas.microsoft.com/winfx/2006/xaml')
          $statusNodes = $document.SelectNodes("//*[@x:Name='HeaderSaveStatusTextBlock']", $namespaces)
          if ($statusNodes.Count -ne 1) { throw "Expected one named dynamic header save-status value; found $($statusNodes.Count)." }
          $headerCard = $statusNodes[0].ParentNode.ParentNode.ParentNode
          $statusLabels = $headerCard.SelectNodes(".//*[local-name()='TextBlock' and @Text='KAYIT DURUMU']")
          if ($statusLabels.Count -ne 1) { throw "The dynamic save-status card must have exactly one status label." }
          if ($xaml -notmatch 'Dört belge tek PDF dosyasında sırasıyla kaydedilir') { throw "Output page description must describe the combined four-page PDF." }
          if ($code -notmatch 'OehsOfficialDocumentFactory.BuildCombined\(context\)' -or $code -notmatch 'outputs\[0\].Pages.Count != 4') { throw "PDF export must generate exactly four official pages in one document." }
          if ($xaml -notmatch 'x:Name="HeaderSaveStatusTextBlock"' -or $xaml -notmatch 'x:Name="HeaderSaveStatusDot"') { throw "Dynamic save-status controls are missing." }
          if ($code -notmatch 'SetHeaderSaveStatus\("Kaydedildi"' -or $code -notmatch 'SetHeaderSaveStatus\("Veri yükleme hatası"') { throw "Load/save status update paths are missing." }

      - name: Verify compact UI layout
        shell: pwsh
        run: |
          $xaml = Get-Content ".\src\OzelEgitimHakedis.Wpf\MainWindow.xaml" -Raw
          $app = Get-Content ".\src\OzelEgitimHakedis.Wpf\App.xaml" -Raw
          [xml]$xamlDocument = $xaml
          $namespaces = [System.Xml.XmlNamespaceManager]::new($xamlDocument.NameTable)
          $namespaces.AddNamespace('x', 'http://schemas.microsoft.com/winfx/2006/xaml')
          foreach ($name in @('NavigationColumn', 'HeaderNavigationColumn')) {
            $column = $xamlDocument.SelectSingleNode("//*[local-name()='ColumnDefinition' and @x:Name='$name']", $namespaces)
            if ($null -eq $column -or $column.Width -ne '215') {
              throw "Expected named sidebar column '$name' to start at 215 DIP."
            }
          }
          if (-not $xaml.Contains('<Grid Width="48" Height="48">')) { throw "The readiness ring container must be 48x48 DIP so its arc is not vertically clipped." }
          if (-not $xaml.Contains('Text="YÜKLENİCİ FİRMALAR"')) { throw "The long contractor navigation label is missing." }
          if ($app -notmatch '<Style x:Key="NavButton"[\s\S]*?<Setter Property="Height" Value="40"/>') { throw "Navigation button height no longer matches the compact layout." }
          if ($app -notmatch '<Style x:Key="PageTitle"[\s\S]*?<Setter Property="FontSize" Value="19.5"/>') { throw "Page title typography was not reduced to the compact target." }

      - name: Verify immutable archive regression coverage
        shell: pwsh
        run: |
          $tests = Get-Content ".\tests\OzelEgitimHakedis.Tests\ProgressPaymentArchiveStoreTests.cs" -Raw
          foreach ($name in @('SaveRevision_ShouldCreateV02AndKeepV01ForRecalculatedPayment', 'SaveRevision_ShouldCreateNewRevisionAndPreserveOriginalWhenRouteChanges')) {
            if (-not $tests.Contains($name)) { throw "Required immutable archive regression missing: $name" }
          }
          # The complete core and WPF suites below verify editor and workflow behavior.
          # Do not duplicate those behavioral checks as exact source-code strings.

      - name: Build Tests
        run: dotnet build ".\tests\OzelEgitimHakedis.Tests\OzelEgitimHakedis.Tests.csproj" --configuration Release --no-restore

      - name: Build WPF Output Tests
        run: dotnet build ".\tests\OzelEgitimHakedis.Wpf.Tests\OzelEgitimHakedis.Wpf.Tests.csproj" --configuration Release --no-restore

      - name: Test Solution
        run: dotnet test ".\tests\OzelEgitimHakedis.Tests\OzelEgitimHakedis.Tests.csproj" --configuration Release --no-build --no-restore

      - name: Test WPF output suite
        run: dotnet test ".\tests\OzelEgitimHakedis.Wpf.Tests\OzelEgitimHakedis.Wpf.Tests.csproj" --configuration Release --no-build --no-restore
        env:
          OEHS_HYBRID_PREVIEW: ${{ github.workspace }}/artifacts/TEHYS-Hybrid-Preview

      - name: Upload hybrid panel render evidence
        id: upload_hybrid_preview
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: OEHS-Hybrid-UI-Render-100-125-150
          path: artifacts/TEHYS-Hybrid-Preview/*.png
          if-no-files-found: warn
          retention-days: 3

      - name: Generate and verify PDF smoke files
        run: .\scripts\Generate-OfficialPdfSmoke.ps1 -OutputDirectory ".\artifacts\TEHYS-PDF-Smoke"

      - name: Upload PDF smoke outputs for visual review
        id: upload_pdf_smoke
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: TEHYS-PDF-Smoke-Review
          path: artifacts/TEHYS-PDF-Smoke/*.pdf
          if-no-files-found: error
          retention-days: 3

      - name: Report PDF smoke artifact limitation
        if: steps.upload_pdf_smoke.outcome == 'failure'
        run: echo "::warning::PDF smoke tests may have passed, but GitHub Actions could not store the sample PDFs. The storage quota may be full."

      - name: Publish Windows EXE
        run: >
          dotnet publish ".\src\OzelEgitimHakedis.Wpf\OzelEgitimHakedis.Wpf.csproj"
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output ".\artifacts\TEHYS"
          /p:PublishSingleFile=true
          /p:IncludeNativeLibrariesForSelfExtract=true
